name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Orcamento-Facil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Orcamento-Facil-APK
          path: Orcamento-Facil.apk

      - name: Publicar o APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-atual --yes --cleanup-tag || true
          gh release create apk-atual Orcamento-Facil.apk --title "Orçamento Fácil (APK mais recente)" --notes "Baixe o arquivo Orcamento-Facil.apk neste celular e abra para instalar."
