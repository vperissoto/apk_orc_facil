<title>Orçamentos - Metalúrgica Demak</title>
<style>:root{
  --navy:#1d3a5c; --navy2:#2a5282; --orange:#d9661a; --ink:#17202b; --grey:#5b6573;
  --line:#c9d1da; --bg:#eef2f6; --card:#fff; --ok:#1b7f45; --err:#b3261e; --light:#f3f6f9;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.35;padding-bottom:110px}
header.brand{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:5px solid var(--orange);position:sticky;top:0;z-index:5}
header.brand .name{font-weight:700;font-size:1.1rem;letter-spacing:.02em}
header.brand .sub{font-size:.7rem;opacity:.8}
main{max-width:1000px;margin:0 auto;padding:22px 18px}
h1{font-size:1.6rem;margin:6px 0 18px;color:var(--navy)}
h2{font-size:1.15rem;margin:0 0 10px;color:var(--navy)}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:10px 28px;border-radius:14px;border:3px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:1.05rem}
.btn:hover{background:#e6edf5}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:4px solid #f4b183;outline-offset:2px}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.go:hover{background:#166a39}
.btn.danger{border-color:var(--err);color:var(--err);min-height:48px;padding:6px 18px;font-size:.85rem}
.btn.small{min-height:48px;padding:6px 18px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.home{display:grid;gap:16px}
.home .btn{justify-content:flex-start;min-height:90px;font-size:1.25rem;text-align:left;padding:16px 28px}
.home .btn small{display:block;font-weight:400;font-size:.8rem;color:var(--grey)}
.home .btn.primary small{color:#c9d8ea}
.home .ic{font-size:1.9rem}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps button{flex:1;border:3px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-weight:700;color:var(--grey);font-size:.85rem;min-height:58px}
.steps button b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--line);color:#fff;margin-right:6px}
.steps button.on{border-color:var(--navy);color:var(--navy);background:#e6edf5}
.steps button.on b{background:var(--navy)}
.steps button.done b{background:var(--ok)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 20px}
.grid .full{grid-column:1/-1}
@media (max-width:760px){.grid{grid-template-columns:1fr}.steps button span{display:none}}
label.f{display:block}
label.f>span{display:block;font-weight:700;margin-bottom:5px;font-size:.9rem}
label.f small{display:block;color:var(--grey);font-size:.72rem;margin-top:4px}
input,textarea,select{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:56px}
textarea{resize:vertical;min-height:110px}
input:focus,textarea:focus{border-color:var(--navy)}
input.bad{border-color:var(--err);background:#fdf1f0}
.err{display:none;background:#fdecea;border:3px solid var(--err);color:var(--err);padding:14px 18px;border-radius:14px;margin-bottom:16px;font-weight:700}
.err.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{border:2px solid var(--line);background:var(--light);border-radius:999px;padding:8px 16px;font-size:.8rem;color:var(--navy);font-weight:600;min-height:44px}
.chips button:hover{border-color:var(--navy)}
.item{border:3px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;background:#fafcfe}
.item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.item .top h3{margin:0;color:var(--navy);font-size:1.05rem}
.item .row{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.2fr;gap:14px;margin-top:14px}
@media (max-width:760px){.item .row{grid-template-columns:1fr 1fr}}
.linetotal{font-size:1.25rem;font-weight:700;color:var(--navy);padding-top:6px}
.linetotal em{font-style:normal;font-size:.7rem;display:block;color:var(--grey);font-weight:600}
.add{width:100%;border:3px dashed var(--navy);background:#fff;color:var(--navy);border-radius:16px;min-height:74px;font-weight:700;font-size:1.15rem}
.add:hover{background:#e6edf5}
.choice{display:flex;gap:12px;flex-wrap:wrap}
.choice label{flex:1 1 280px;border:3px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:600;font-size:.9rem;background:#fff}
.choice input{width:26px;height:26px;min-height:0;accent-color:var(--navy)}
.choice label.sel{border-color:var(--navy);background:#e6edf5}
.pct{display:flex;align-items:center;gap:10px;margin-top:12px}
.pct input{width:120px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 20px;font-size:.95rem}
.sum .big{font-size:1.7rem;font-weight:800;color:var(--navy)}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0}
.ok{background:#e8f6ee;border:3px solid var(--ok);color:#12522c;padding:16px 20px;border-radius:14px;font-weight:600;margin:12px 0}
iframe.pv{width:100%;height:760px;border:3px solid var(--line);border-radius:14px;background:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:5px solid var(--navy);padding:12px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between;z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.1)}
.bar .tot{font-size:.7rem;color:var(--grey);font-weight:600}
.bar .tot b{display:block;font-size:1.35rem;color:var(--navy)}
.bar .nav{display:flex;gap:12px}
.hist{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px 18px;margin-bottom:12px}
.hist .t{font-weight:700;color:var(--navy)}
.hist .m{font-size:.8rem;color:var(--grey)}
.tag{display:inline-block;font-size:.65rem;padding:2px 10px;border-radius:999px;background:#fff3e6;color:#9a4a0b;font-weight:700;margin-left:8px}
.tag.pronto{background:#e8f6ee;color:#12522c}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:#17202b;color:#fff;padding:14px 24px;border-radius:14px;font-weight:600;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.warn{background:#fff8e6;border:2px solid #e0b400;padding:12px 16px;border-radius:12px;font-size:.8rem;margin-bottom:14px}

.modal{position:fixed;inset:0;background:rgba(15,25,40,.6);display:grid;place-items:center;z-index:50;padding:18px}
.modal .box{background:#fff;border-radius:18px;padding:26px;max-width:560px;width:100%;border:4px solid var(--navy)}
.modal p{margin:0 0 6px;font-size:1.1rem;font-weight:600}

@media (max-width:520px){
  html{font-size:18px}
  header.brand{padding:10px 14px}
  main{padding:16px 12px}
  .bar{padding:10px 10px;gap:8px}
  .bar .tot b{font-size:1.1rem}
  .bar .btn{padding:6px 14px;min-height:56px;font-size:.9rem;white-space:nowrap}
  .bar .nav{gap:8px}
  .actions .btn{width:100%}
  .home .btn{padding:14px 18px}
}
</style>
</head>
<body>
<header class="brand">
  <div><div class="name" id="brandname">Orçamentos</div><div class="sub">Sistema de orçamentos</div></div>
  <button class="btn small" id="home-btn" style="min-height:48px">🏠 Início</button>
</header>
<main id="main"></main>
<div class="bar" id="bar" style="display:none"></div>

<script>/* ===== utilidades ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nfMoney = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const store = {
  ok: (() => { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return true; } catch (e) { return false; } })(),
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

const DEFAULT_COMPANY = {
  nome: 'METALURGICA DEMAK LTDA ME',
  slogan: 'Equipamentos e peças para fábrica de ração',
  endereco: 'Rua Cedro, 215 - Vila Santa Cruz',
  cidade: 'Limeira - SP',
  cep: '13485-053',
  cnpj: '45.516.497/0001-33',
  ie: '41.771.411.1115',
  fone: '(19) 97127-1077  /  (19) 3442-2782',
  email: 'perialber@gmail.com',
  vendedor: 'Alberto Perissoto',
  proximoNumero: 1478,
  validade: 15,
  apae: true
};

/* dinheiro / números (tudo em centavos para não errar conta) */
function parseNum(s) {
  if (s === null || s === undefined) return null;
  s = String(s).trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function parseMoney(s) {
  if (s === null || s === undefined) return null;
  s = String(s).replace(/R\$/gi, '').replace(/\s/g, '');
  if (s === '') return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) && n >= 0 ? Math.round(n * 100) : null;
}
const fmtCents = c => nfMoney.format(c / 100);
const money = c => 'R$ ' + fmtCents(c);

function calc(q) {
  let sub = 0;
  const lines = q.itens.map(it => {
    const unit = parseMoney(it.unit);
    if (unit === null) return null;
    const qtd = parseNum(it.qtd);
    const lt = Math.round((qtd === null ? 1 : qtd) * unit);
    sub += lt;
    return lt;
  });
  const pct = q.impostoModo === 'somar' ? (parseNum(q.impostoPct) || 0) : 0;
  const imp = Math.round(sub * pct / 100);
  return { lines, sub, pct, imp, total: sub + imp };
}

/* datas */
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || ''); };

/* máscaras */
const onlyDigits = s => String(s || '').replace(/\D/g, '');
function maskDoc(s) {
  const d = onlyDigits(s);
  if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
  return s;
}
function maskCep(s) { const d = onlyDigits(s); return d.length === 8 ? d.replace(/(\d{5})(\d{3})/, '$1-$2') : s; }
function maskFone(s) {
  const d = onlyDigits(s);
  if (d.length === 10) return d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
  if (d.length === 11) return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
  return s;
}

function fileSafe(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim().slice(0, 50);
}
function baseName(q) {
  return ('Orcamento ' + fileSafe(String(q.numero || 's-n').replace('/', '-')) + (q.cliente ? ' - ' + fileSafe(q.cliente) : '')).trim();
}
function b64ToBytes(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

/* ponte com o app Android (quando existir) */
const IS_ANDROID_APP = typeof window !== 'undefined' && !!window.AndroidApp;
const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function deliver(blob, name, open) {
  if (IS_ANDROID_APP) { window.AndroidApp.saveFile(name, blob.type || 'application/octet-stream', await blobToB64(blob), !!open); return; }
  downloadBlob(blob, name);
}
async function shareBlob(blob, name) { window.AndroidApp.shareFile(name, blob.type || 'application/octet-stream', await blobToB64(blob)); }

/* compartilhar (janela do celular: WhatsApp, e-mail...) */
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
const CAN_SHARE = IS_ANDROID_APP || (IS_MOBILE && typeof navigator.share === 'function' && typeof navigator.canShare === 'function');
async function shareList(items, title) {   // items: [{blob, name}]
  if (IS_ANDROID_APP) {
    const arr = [];
    for (const it of items) arr.push({ name: it.name, mime: it.blob.type || 'application/octet-stream', b64: await blobToB64(it.blob) });
    window.AndroidApp.shareFiles(JSON.stringify(arr));
    return true;
  }
  const files = items.map(it => new File([it.blob], it.name, { type: it.blob.type }));
  if (!navigator.canShare({ files })) return false;
  try { await navigator.share({ files, title: title || 'Orçamento' }); } catch (e) { if (e && e.name === 'AbortError') return true; throw e; }
  return true;
}

<script>/* ===== PDF ===== */
async function buildPdf(q, company) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const F = await doc.embedFont(StandardFonts.Helvetica);
  const B = await doc.embedFont(StandardFonts.HelveticaBold);
  const I = await doc.embedFont(StandardFonts.HelveticaOblique);
  const seal = company.apae ? await doc.embedJpg(b64ToBytes(SEAL_B64)) : null;

  const W = 595.28, H = 841.89, M = 36;
  const NAVY = rgb(.114, .227, .361), ORANGE = rgb(.851, .4, .102), GREY = rgb(.36, .4, .45),
    LIGHT = rgb(.953, .965, .976), LINE = rgb(.8, .83, .86), INK = rgb(.09, .125, .17), WHITE = rgb(1, 1, 1),
    ZEBRA = rgb(.972, .98, .988), PALE = rgb(.8, .87, .94);
  const LIMIT = H - 80;       // limite do conteúdo (acima do rodapé)

  /* texto seguro para fonte padrão (WinAnsi) */
  const MAP = { '″': '"', '≥': '>=', '≤': '<=', '⌀': 'Ø', '∅': 'Ø', ' ': ' ', '​': '', '′': "'", '→': '->', '⅜': '3/8', '½': '1/2' };
  const okCache = new Map();
  function clean(font, s) {
    s = String(s ?? '').replace(/\r/g, '').replace(/\t/g, '  ');
    let out = '';
    for (const ch of s) {
      const m = MAP[ch] !== undefined ? MAP[ch] : ch;
      for (const c of m) {
        const k = font.name + c;
        let ok = okCache.get(k);
        if (ok === undefined) { try { font.encodeText(c); ok = true; } catch (e) { ok = false; } okCache.set(k, ok); }
        out += ok ? c : '?';
      }
    }
    return out;
  }
  const tw = (font, size, s) => font.widthOfTextAtSize(clean(font, s), size);
  function wrap(font, size, text, maxW) {
    const out = [];
    for (const para of String(text ?? '').split('\n')) {
      const words = para.split(/\s+/).filter(Boolean);
      if (!words.length) { out.push(''); continue; }
      let line = '';
      for (let w of words) {
        while (tw(font, size, w) > maxW) {      // palavra gigante: quebra por letras
          let cut = w.length;
          while (cut > 1 && tw(font, size, w.slice(0, cut)) > maxW) cut--;
          if (line) { out.push(line); line = ''; }
          out.push(w.slice(0, cut)); w = w.slice(cut);
        }
        const t = line ? line + ' ' + w : w;
        if (tw(font, size, t) <= maxW) line = t; else { out.push(line); line = w; }
      }
      out.push(line);
    }
    return out;
  }

  let page, y;
  const pages = [];
  const T = (txt, x, top, size, font, color, align = 'l') => {
    txt = clean(font, txt);
    const w = font.widthOfTextAtSize(txt, size);
    const px = align === 'r' ? x - w : align === 'c' ? x - w / 2 : x;
    page.drawText(txt, { x: px, y: H - top - size * 0.8, size, font, color });
  };
  const R = (x, top, w, h, fill, border) => page.drawRectangle({ x, y: H - top - h, width: w, height: h, color: fill, borderColor: border, borderWidth: border ? 0.8 : 0 });
  const L = (x1, top, x2, color = LINE, th = 0.8) => page.drawLine({ start: { x: x1, y: H - top }, end: { x: x2, y: H - top }, thickness: th, color });

  const numero = q.numero || 's/n';
  function newPage(first) {
    page = doc.addPage([W, H]); pages.push(page);
    if (first) {
      R(0, 0, W, 92, NAVY); R(0, 92, W, 4, ORANGE);
      let sz = 21; const maxW = W - 2 * M - 190;
      while (sz > 13 && tw(B, sz, company.nome) > maxW) sz--;
      T(company.nome, M, 26, sz, B, WHITE);
      T(company.slogan || '', M, 54, 10, I, PALE);
      T(`${company.cidade || ''}${company.fone ? '  |  ' + company.fone.split('/')[0].trim() : ''}`, M, 70, 8.5, F, PALE);
      T('ORÇAMENTO', W - M, 22, 9, B, PALE, 'r');
      T('Nº ' + numero, W - M, 36, 22, B, WHITE, 'r');
      T('Emitido em ' + fmtDate(q.data), W - M, 66, 9, F, PALE, 'r');
      y = 114;
    } else {

let histFilter = '';
const sortKey = q => String(q.data || '') || '0000';
function histItems() {
  const t = norm2(histFilter);
  const list = [...quotes].sort((a, b) => sortKey(b).localeCompare(sortKey(a)) || (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
  const terms = t.split(/\s+/).filter(Boolean);
  return terms.length ? list.filter(q => { const hay = norm2([q.cliente, q.numero, q.cidade, q.contato, ...(q.itens || []).map(i => i.desc + ' ' + i.cod)].join(' ')); return terms.every(w => hay.includes(w)); }) : list;
}
const norm2 = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function histCards(list) {
  const shown = list.slice(0, 60);
  return shown.map(q => `<div class="hist"><div><div class="t">nº ${esc(q.numero)} — ${esc(q.cliente || 'Sem nome')}<span class="tag ${q.status === 'pronto' ? 'pronto' : ''}">${q.status === 'pronto' ? 'Pronto' : 'Em andamento'}</span></div>
    <div class="m">${fmtDate(q.data)} · ${money(calc(q).total)}${q.itens && q.itens[0] && q.itens[0].desc ? ' · ' + esc(q.itens[0].desc.slice(0, 50)) : ''}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn small primary" data-act="open" data-id="${q.id}">Abrir</button><button class="btn small" data-act="copy" data-id="${q.id}">Copiar para novo</button><button class="btn danger" data-act="del" data-id="${q.id}">Excluir</button></div></div>`).join('')
    + (list.length > shown.length ? `<p style="color:var(--grey)">Mostrando os ${shown.length} mais recentes de ${list.length}. Use a busca acima para achar os outros.</p>` : '')
    + (!list.length ? '<p>Nenhum orçamento encontrado.</p>' : '');
}
function viewHist() {
  const list = histItems();
  return `<h1>Orçamentos anteriores</h1>
  <label class="f" style="margin-bottom:16px"><span>🔍 Buscar (cliente, número, peça...)</span><input id="histq" value="${esc(histFilter)}" placeholder="Ex.: aviagen, martelo, 784" autocomplete="off"></label>
  <div id="histlist">${histCards(list)}</div>
  <div class="actions"><button class="btn small" data-act="backup">💾 Salvar cópia de segurança</button>
  <label class="btn small" style="cursor:pointer">📥 Restaurar cópia<input type="file" accept=".json" data-act="restore" hidden></label></div>`;
}
function viewSettings() {
  const f = (l, k, o = {}) => `<label class="f ${o.cls || ''}"><span>${l}</span><input data-c="${k}" value="${esc(company[k])}" ${o.t ? `type="${o.t}"` : ''}></label>`;
  return `<h1>Dados da empresa</h1><div class="card"><p style="margin-top:0">Esses dados aparecem no cabeçalho e no rodapé de todo orçamento.</p><div class="grid">
    ${f('Nome da empresa', 'nome', { cls: 'full' })}${f('Frase abaixo do nome', 'slogan', { cls: 'full' })}
    ${f('Endereço', 'endereco', { cls: 'full' })}${f('Cidade - UF', 'cidade')}${f('CEP', 'cep')}
    ${f('CNPJ', 'cnpj')}${f('Inscrição Estadual', 'ie')}${f('Telefones', 'fone', { cls: 'full' })}${f('E-mail', 'email', { cls: 'full' })}
    ${f('Nome do vendedor (padrão)', 'vendedor')}${f('Número do próximo orçamento', 'proximoNumero', { t: 'number' })}${f('Validade padrão (dias)', 'validade', { t: 'number' })}
    <div class="choice full"><label class="${company.apae ? 'sel' : ''}"><input type="checkbox" data-c="apae" ${company.apae ? 'checked' : ''}> Mostrar o selo "Empresa Cidadã - APAE" no rodapé</label></div>
  </div><div class="actions"><button class="btn go" data-act="savesettings">✔ Salvar</button><button class="btn" data-act="home">Cancelar</button></div></div>`;

/* ---------- desenho da tela ---------- */
function render() {
  const main = $('#main'), bar = $('#bar');
  $('#brandname').textContent = company.nome;
  $('#home-btn').style.display = view === 'home' ? 'none' : '';
  if (view === 'wizard') {
    const body = [viewStep0, viewStep1, viewStep2, viewStep3][step]();
    main.innerHTML = `<div class="steps">${STEPS.map((s, i) => `<button data-act="goto" data-s="${i}" class="${i === step ? 'on' : ''} ${i < step ? 'done' : ''}"><b>${i < step ? '✓' : i + 1}</b><span>${s}</span></button>`).join('')}</div>` + body;
    bar.style.display = 'flex';
    bar.innerHTML = `<div class="tot">Total do orçamento<b id="totv">${money(calc(Q).total)}</b></div>
      <div class="nav">${step > 0 ? '<button class="btn" data-act="back">◀ Voltar</button>' : ''}${step < 3 ? '<button class="btn primary" data-act="next">Avançar ▶</button>' : ''}</div>`;
    if (step === 1) updateLines();
    if (step === 3) refreshPreview();
  } else {
    bar.style.display = 'none';
    main.innerHTML = { home: viewHome, hist: viewHist, settings: viewSettings }[view]();
  }
  window.scrollTo(0, 0);
}
function updateLines() {
  const c = calc(Q);
  Q.itens.forEach((it, i) => { const el = $('#lt' + i); if (el) el.innerHTML = c.lines[i] === null ? '<em>Total do item</em>sem valor' : `<em>Total do item</em>${money(c.lines[i])}`; });
}
function updateTotal() { const el = $('#totv'); if (el) el.textContent = money(calc(Q).total); updateLines(); }

function showErr(msg) {
  const e = $('#err'); if (!e) return;
  e.textContent = msg; e.classList.add('show'); e.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function validate(s) {
  if (s === 0) {
    if (!(Q.cliente || '').trim()) { showErr('Falta o nome do cliente. Escreva o nome no primeiro campo.'); $('[data-k=cliente]').classList.add('bad'); $('[data-k=cliente]').focus(); return false; }
    if ((Q.email || '').trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(Q.email.trim())) { showErr('O e-mail parece estar errado (confira se tem o @ e o ponto). Exemplo: nome@gmail.com'); $('[data-k=email]').classList.add('bad'); $('[data-k=email]').focus(); return false; }
  }
  if (s === 1) {
    if (!Q.itens.some(i => (i.desc || '').trim())) { showErr('Escreva pelo menos um item no orçamento (o que está sendo vendido).'); const t = $('[data-f=desc]'); t && (t.classList.add('bad'), t.focus()); return false; }
    const badIdx = Q.itens.findIndex(i => (i.unit || '').trim() && parseMoney(i.unit) === null);
    if (badIdx >= 0) { showErr(`O valor do item ${badIdx + 1} não parece um número. Escreva assim: 1250,50`); $(`[data-i="${badIdx}"][data-f=unit]`).classList.add('bad'); return false; }
    const badQ = Q.itens.findIndex(i => (i.qtd || '').trim() && parseNum(i.qtd) === null);
    if (badQ >= 0) { showErr(`A quantidade do item ${badQ + 1} não parece um número.`); $(`[data-i="${badQ}"][data-f=qtd]`).classList.add('bad'); return false; }
  }
  return true;
}
function go(n) {
  if (n > step) for (let s = step; s < n; s++) if (!validate(s)) return;
  step = n; saveQuote(); render();
}

/* ---------- gerar arquivos ---------- */
async function refreshPreview() {
  if (IS_ANDROID_APP) { const bx = $('#pvbox'); if (bx) bx.innerHTML = '<p>Toque em <b>"Ver / Imprimir PDF"</b> para ver como o orçamento vai ficar.</p>'; return; }
  try {
    const bytes = await buildPdf(Q, company);
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const box = $('#pvbox'); if (box) box.innerHTML = `<iframe class="pv" src="${previewUrl}#toolbar=0&navpanes=0"></iframe>`;
  } catch (e) { const box = $('#pvbox'); if (box) box.innerHTML = '<p>Não foi possível mostrar a visualização, mas você pode gerar o PDF normalmente.</p>'; console.error(e); }
}
async function generate(what, share) {
  for (const s of [0, 1]) if (!validate(s)) { step = s; render(); validate(s); return; }
  const done = $('#done'); done.innerHTML = '<p>Gerando…</p>';
  try {
    const name = baseName(Q);
    lastFiles = { name };
    if (what === 'both' || what === 'pdf') lastFiles.pdf = new Blob([await buildPdf(Q, company)], { type: 'application/pdf' });
    if (what === 'both' || what === 'xlsx') lastFiles.xlsx = new Blob([await buildXlsx(Q, company)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (!share) {
      if (lastFiles.pdf) await deliver(lastFiles.pdf, name + '.pdf', false);
      if (lastFiles.xlsx) { await new Promise(r => setTimeout(r, 600)); await deliver(lastFiles.xlsx, name + '.xlsx', false); }
    }
    const first = !quotes.some(x => x.id === Q.id && x.status === 'pronto');
    if (first && String(Q.numero).startsWith(company.proximoNumero + '/')) company.proximoNumero = (+company.proximoNumero || 0) + 1;
    saveQuote('pronto');
    if (share) {
      const items = [];
      if (lastFiles.pdf) items.push({ blob: lastFiles.pdf, name: name + '.pdf' });
      if (lastFiles.xlsx) items.push({ blob: lastFiles.xlsx, name: name + '.xlsx' });
      const ok = await shareList(items, 'Orçamento ' + (Q.numero || ''));
      if (!ok) { done.innerHTML = '<div class="err show">Este aparelho não conseguiu abrir o compartilhamento. Use "Salvar" e envie o arquivo pela pasta Downloads.</div>'; return; }
      done.innerHTML = `<div class="ok">✔ Pronto! Se a janela de envio fechou sem enviar, toque de novo em <b>Enviar / Compartilhar</b>.</div>
      <div class="actions"><button class="btn primary" data-act="new">➕ Fazer outro orçamento</button><button class="btn" data-act="home">Voltar ao início</button></div>`;
      return;
    }
    done.innerHTML = `<div class="ok">✔ Pronto! ${what === 'both' ? 'O PDF e o Excel foram salvos' : 'O arquivo foi salvo'} na pasta <b>Downloads</b> ${IS_ANDROID_APP ? 'do celular' : 'do computador'}, com o nome:<br><b>${esc(name)}</b>${IS_ANDROID_APP ? '' : '<br><br>Se o navegador perguntar, clique em <b>"Permitir"</b> para baixar mais de um arquivo.'}</div>
      <div class="actions">${CAN_SHARE ? '<button class="btn go" data-act="share" data-w="all">📤 Enviar / Compartilhar</button>' : ''}<button class="btn primary" data-act="new">➕ Fazer outro orçamento</button><button class="btn" data-act="home">Voltar ao início</button></div>`;
  } catch (e) { console.error(e); done.innerHTML = '<div class="err show">Não foi possível gerar o arquivo. Tente novamente.</div>'; }
}

/* ---------- eventos ---------- */
const app = document.body;
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'histq') { histFilter = t.value; $('#histlist').innerHTML = histCards(histItems()); return; }
  t.classList.remove('bad'); const er = $('#err'); if (er) er.classList.remove('show');
  if (t.dataset.k) {
    Q[t.dataset.k] = t.value;
    if (t.dataset.k === 'cliente') fillFromHistory(t.value);
    if (t.dataset.k === 'impostoPct') updateTotal();
    scheduleSave();
  } else if (t.dataset.i !== undefined) {
    Q.itens[+t.dataset.i][t.dataset.f] = t.value; updateTotal(); scheduleSave();
  }
});
function fillFromHistory(name) {
  const m = quotes.filter(x => x.cliente === name && x.id !== Q.id).sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0))[0];
  if (!m || Q._filled === name) return;
  const empty = ['cnpj', 'ie', 'contato', 'fone', 'email', 'endereco', 'bairro', 'cidade', 'cep'].every(k => !(Q[k] || '').trim());
  if (!empty) return;
  ['cnpj', 'ie', 'contato', 'fone', 'email', 'endereco', 'bairro', 'cidade', 'cep'].forEach(k => { Q[k] = m[k] || ''; const el = $(`[data-k=${k}]`); if (el) el.value = Q[k]; });
  Q._filled = name; toast('Dados do cliente preenchidos automaticamente ✔');
}
app.addEventListener('focusout', e => {
  const t = e.target, mk = t.dataset && t.dataset.mask;
  if (!mk) return;
  const f = { doc: maskDoc, cep: maskCep, fone: maskFone, money: v => { const c = parseMoney(v); return c === null ? v : fmtCents(c); } }[mk];
  const nv = f(t.value);
  if (nv !== t.value) { t.value = nv; t.dispatchEvent(new Event('input', { bubbles: true })); }
});
app.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.act === 'imp') { Q.impostoModo = t.value; saveQuote(); render(); return; }
  if (t.dataset.c) { company[t.dataset.c] = t.type === 'checkbox' ? t.checked : t.value; if (t.type === 'checkbox') t.closest('label').classList.toggle('sel', t.checked); }
  if (t.dataset.act === 'restore' && t.files[0]) {
    try {
      const d = JSON.parse(await t.files[0].text());
      if (Array.isArray(d.quotes)) { const ids = new Set(quotes.map(x => x.id)); d.quotes.forEach(x => { if (!ids.has(x.id)) quotes.push(x); }); }
      if (d.company) company = Object.assign({}, company, d.company);
      persist(); toast('Cópia restaurada ✔'); render();
    } catch (err) { toast('Esse arquivo não é uma cópia válida.'); }
  }
});
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  const a = b.dataset.act;
  if (a === 'home') { saveQuote(); view = 'home'; render(); }
  else if (a === 'new') { Q = blankQuote(); view = 'wizard'; step = 0; render(); }
  else if (a === 'open') { const q = quotes.find(x => x.id === b.dataset.id); if (q) { Q = JSON.parse(JSON.stringify(q)); view = 'wizard'; step = 0; render(); } }
  else if (a === 'copy') { const q = quotes.find(x => x.id === b.dataset.id); if (q) { Q = Object.assign(JSON.parse(JSON.stringify(q)), blankQuote(), {}); const src = JSON.parse(JSON.stringify(q)); Object.keys(src).forEach(k => { if (!['id', 'status', 'numero', 'data', 'atualizadoEm'].includes(k)) Q[k] = src[k]; }); view = 'wizard'; step = 0; render(); } }
  else if (a === 'del') { const q = quotes.find(x => x.id === b.dataset.id); if (q) ask(`Excluir o orçamento nº ${q.numero} de ${q.cliente || 'sem nome'}? Isso não pode ser desfeito.`, 'Sim, excluir').then(ok => { if (ok) { quotes = quotes.filter(x => x.id !== q.id); persist(); render(); } }); }
  else if (a === 'hist') { view = 'hist'; render(); }
  else if (a === 'settings') { view = 'settings'; render(); }
  else if (a === 'savesettings') { company.proximoNumero = +company.proximoNumero || 1; company.validade = +company.validade || 15; persist(); toast('Dados salvos ✔'); view = 'home'; render(); }
  else if (a === 'next') go(step + 1);
  else if (a === 'back') go(step - 1);
  else if (a === 'goto') go(+b.dataset.s);
  else if (a === 'additem') { Q.itens.push({ cod: '', desc: '', qtd: '1', unit: '' }); const i = Q.itens.length - 1; $('#items').insertAdjacentHTML('beforeend', itemCard(Q.itens[i], i)); updateLines(); const el = $(`[data-i="${i}"][data-f=desc]`); el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); saveQuote(); }
  else if (a === 'rmitem') { const i = +b.dataset.i; ask(`Remover o item ${i + 1}? ${(Q.itens[i].desc || '').slice(0, 80)}`, 'Sim, remover').then(ok => { if (ok) { Q.itens.splice(i, 1); saveQuote(); render(); } }); }
  else if (a === 'chip') { Q[b.dataset.key] = b.dataset.v; const el = $(`input[data-k=${b.dataset.key}]`); el.value = b.dataset.v; scheduleSave(); }
  else if (a === 'obs') { const ta = $('textarea[data-k=obs]'); const v = b.dataset.v; if (!(Q.obs || '').includes(v)) { Q.obs = ((Q.obs || '').trim() ? Q.obs.trim() + '\n' : '') + v; ta.value = Q.obs; scheduleSave(); } else toast('Essa frase já está no texto.'); }
  else if (a === 'obsclear') { const clr = () => { Q.obs = ''; $('textarea[data-k=obs]').value = ''; scheduleSave(); }; if (!(Q.obs || '').trim()) clr(); else ask('Apagar todo o texto das observações?', 'Sim, apagar').then(ok => ok && clr()); }
  else if (a === 'gen') generate(b.dataset.what, !!b.dataset.share);
  else if (a === 'share') { const items = []; if (lastFiles.pdf) items.push({ blob: lastFiles.pdf, name: lastFiles.name + '.pdf' }); if (lastFiles.xlsx) items.push({ blob: lastFiles.xlsx, name: lastFiles.name + '.xlsx' }); if (items.length) shareList(items, 'Orçamento').catch(() => toast('Não foi possível compartilhar.')); }
  else if (a === 'print' && IS_ANDROID_APP) { buildPdf(Q, company).then(by => deliver(new Blob([by], { type: 'application/pdf' }), baseName(Q) + '.pdf', true)); }
  else if (a === 'print') { if (previewUrl) window.open(previewUrl, '_blank'); else buildPdf(Q, company).then(by => window.open(URL.createObjectURL(new Blob([by], { type: 'application/pdf' })), '_blank')); }
  else if (a === 'backup') deliver(new Blob([JSON.stringify({ company, quotes }, null, 1)], { type: 'application/json' }), 'Copia de seguranca orcamentos ' + todayISO() + '.json');
});
window.addEventListener('beforeunload', () => saveQuote());

$('#home-btn').addEventListener('click', () => { saveQuote(); view = 'home'; render(); });
$('#brandname').textContent = company.nome;
seedIfNeeded();
importHistoryIfNeeded();
render();
window.DEMAK = { buildPdf, buildXlsx, get quotes() { return quotes; }, get company() { return company; } };
</script>
</body>
</html>
